name: Desktop bridge
on:
  pull_request:
    paths: ['desktop-bridge/**', '.github/workflows/desktop-bridge.yml']
  push:
    branches: [main, master]
    tags: ['bridge-v*']
    paths: ['desktop-bridge/**', '.github/workflows/desktop-bridge.yml']
  workflow_dispatch:
    inputs:
      inspect_release:
        description: 'Optional existing bridge-vX.Y.Z Mac release to inspect before building'
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: bridge-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop-bridge
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: ${{ matrix.os == 'macos-latest' && github.event_name != 'pull_request' && secrets.MAC_CERTIFICATE != '' && 'true' || 'false' }}
      SEEK_BRIDGE_SMOKE_OUTPUT: smoke-output
      # Explicitly authorized preview distribution; integrity is verified on the final DMG/ZIP.
      SEEK_MAC_ALLOW_UNNOTARIZED_PREVIEW: '1'
      SEEK_MAC_SIGNED_RELEASE: ${{ matrix.os == 'macos-latest' && github.event_name != 'pull_request' && secrets.MAC_CERTIFICATE != '' && '1' || '0' }}
      CSC_LINK: ${{ matrix.os == 'macos-latest' && github.event_name != 'pull_request' && secrets.MAC_CERTIFICATE || '' }}
      CSC_KEY_PASSWORD: ${{ matrix.os == 'macos-latest' && github.event_name != 'pull_request' && secrets.MAC_CERTIFICATE_PASSWORD || '' }}
      APPLE_ID: ${{ matrix.os == 'macos-latest' && github.event_name != 'pull_request' && secrets.APPLE_ID || '' }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.os == 'macos-latest' && github.event_name != 'pull_request' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
      APPLE_TEAM_ID: ${{ matrix.os == 'macos-latest' && github.event_name != 'pull_request' && secrets.APPLE_TEAM_ID || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop-bridge/package-lock.json
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm run check
      - run: npm test
      - name: Authenticated WebRTC through a real TURN relay
        if: runner.os == 'Linux'
        run: npm run smoke:turn
      - run: npm run test:python
      - run: npm audit --audit-level=high
      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/bridge-v')
        run: node -e "if(process.env.GITHUB_REF_NAME !== 'bridge-v'+require('./package.json').version)process.exit(1)"
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: sudo apt-get update && sudo apt-get install -y xvfb xdotool python3-gi gir1.2-atspi-2.0 at-spi2-core dbus-x11 openbox
      - name: Inspect reported Mac download
        if: runner.os == 'macOS' && github.event_name == 'workflow_dispatch' && inputs.inspect_release != ''
        env:
          GH_TOKEN: ${{ github.token }}
          INSPECT_RELEASE: ${{ inputs.inspect_release }}
        run: |
          [[ "$INSPECT_RELEASE" =~ ^bridge-v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh release download "$INSPECT_RELEASE" --pattern '*mac-universal.dmg' --dir "$RUNNER_TEMP/mac-release-inspect"
          node scripts/verify-mac.mjs --inspect --dmg "$RUNNER_TEMP/mac-release-inspect/seek-desktop-${INSPECT_RELEASE#bridge-v}-mac-universal.dmg"
      - run: npm run build:dir
      - name: Configure packaged Linux sandbox on the runner
        if: runner.os == 'Linux'
        run: sudo chown root:root dist/linux-unpacked/chrome-sandbox && sudo chmod 4755 dist/linux-unpacked/chrome-sandbox
      - name: Packaged app smoke test
        if: runner.os != 'Linux'
        run: npm run smoke:packaged
      - name: Packaged Linux smoke test
        if: runner.os == 'Linux'
        run: dbus-run-session -- xvfb-run -a npm run smoke:packaged
      - name: Windows native accessibility round trip
        if: runner.os == 'Windows'
        run: npm run smoke:packaged:input
      - name: Linux native accessibility round trip
        if: runner.os == 'Linux'
        run: dbus-run-session -- xvfb-run -a bash scripts/linux-smoke.sh
      - run: npm run package
      - name: Verify final Mac DMG and ZIP signatures, architectures and launch
        if: runner.os == 'macOS'
        run: npm run verify:mac
      - name: Record tested installer provenance
        run: node scripts/release-metadata.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bridge-${{ runner.os }}-${{ runner.arch }}
          path: |
            desktop-bridge/dist/*.exe
            desktop-bridge/dist/*.zip
            desktop-bridge/dist/*.dmg
            desktop-bridge/dist/*.AppImage
            desktop-bridge/dist/*.deb
            desktop-bridge/dist/release-*.json
          if-no-files-found: warn
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-${{ runner.os }}-${{ runner.arch }}
          path: desktop-bridge/smoke-output/*.png
          if-no-files-found: ignore
  publish-release:
    if: startsWith(github.ref, 'refs/tags/bridge-v') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: bridge-*
          path: release
          merge-multiple: true
      - name: Publish the version after exact-commit Work and desktop checks
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        working-directory: desktop-bridge
        run: node scripts/publish-release.mjs
