name: Desktop bridge
on:
  pull_request:
    paths: ['desktop-bridge/**', '.github/workflows/desktop-bridge.yml']
  push:
    branches: [main, master]
    tags: ['bridge-v*']
    paths: ['desktop-bridge/**', '.github/workflows/desktop-bridge.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bridge-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop-bridge
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      SEEK_BRIDGE_SMOKE_OUTPUT: smoke-output
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop-bridge/package-lock.json
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm run check
      - run: npm test
      - name: Authenticated WebRTC through a real TURN relay
        if: runner.os == 'Linux'
        run: npm run smoke:turn
      - run: npm run test:python
      - run: npm audit --audit-level=high
      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/bridge-v')
        run: node -e "if(process.env.GITHUB_REF_NAME !== 'bridge-v'+require('./package.json').version)process.exit(1)"
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: sudo apt-get update && sudo apt-get install -y xvfb xdotool python3-gi gir1.2-atspi-2.0 at-spi2-core dbus-x11 openbox
      - run: npm run build:dir
      - name: Configure packaged Linux sandbox on the runner
        if: runner.os == 'Linux'
        run: sudo chown root:root dist/linux-unpacked/chrome-sandbox && sudo chmod 4755 dist/linux-unpacked/chrome-sandbox
      - name: Packaged app smoke test
        if: runner.os != 'Linux'
        run: npm run smoke:packaged
      - name: Packaged Linux smoke test
        if: runner.os == 'Linux'
        run: dbus-run-session -- xvfb-run -a npm run smoke:packaged
      - name: Windows native accessibility round trip
        if: runner.os == 'Windows'
        run: npm run smoke:packaged:input
      - name: Linux native accessibility round trip
        if: runner.os == 'Linux'
        run: dbus-run-session -- xvfb-run -a bash scripts/linux-smoke.sh
      - run: npm run package
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bridge-${{ runner.os }}-${{ runner.arch }}
          path: |
            desktop-bridge/dist/*.exe
            desktop-bridge/dist/*.zip
            desktop-bridge/dist/*.dmg
            desktop-bridge/dist/*.AppImage
            desktop-bridge/dist/*.deb
            desktop-bridge/smoke-output/*.png
          if-no-files-found: warn
          compression-level: 0
  draft-release:
    if: startsWith(github.ref, 'refs/tags/bridge-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: bridge-*
          path: release
          merge-multiple: true
      - name: Prepare draft preview release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          # Artifacts keep their folders: installers in dist/, smoke screenshots (not released) in smoke-output/.
          cd release/dist
          sha256sum * > SHA256SUMS
          printf '%s\n' 'Seek Desktop developer preview. Desktop control uses authenticated WebRTC with verified device keys. Connect using a one-use link in Seek Settings > Computers; identities verify automatically. Old pairings require pairing again. Configure an Internet relay once in Seek Settings > Computers > Connections. Unsigned installers; no automatic update. Qwen uses text accessibility observations. macOS requires Accessibility permission; Linux requires AT-SPI, X11 at 100% scaling and an unlocked protected keychain. Windows selected-window fill/invoke support background operation. Wayland control and human screen streaming remain unfinished. See desktop-bridge/SECURITY.md for the trust boundary and validation limits.' > "$RUNNER_TEMP/notes.md"
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft --prerelease --title "Seek Desktop $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
          fi
          test "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" = true
          gh release upload "$GITHUB_REF_NAME" ./* --clobber
