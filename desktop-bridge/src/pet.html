<!doctype html><html lang="en"><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'"><link rel="stylesheet" href="buddy.css"><style>body{margin:0;overflow:hidden;background:transparent;display:flex;flex-direction:column;align-items:center;font:11px system-ui}.buddy{--bs:78px!important}.mascot{border:0;padding:8px 12px 0;background:none;cursor:pointer;border-radius:18px}.mascot:focus-visible{outline:2px solid var(--b-deep)}.label{color:color-mix(in srgb,var(--b-line) 65%,#29272c);background:color-mix(in srgb,var(--b-hi) 95%,transparent);padding:5px 10px;border:1px solid color-mix(in srgb,var(--b-mid) 40%,white);border-radius:12px;max-width:170px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}.controls{display:flex;gap:5px;margin-top:5px}.controls button{font:11px system-ui;background:var(--b-hi);color:var(--b-line);border:1px solid var(--b-mid);border-radius:9px;padding:4px 7px;cursor:pointer}#grip{cursor:grab}#stop{color:#963e31;background:#fff2ed;border-color:#e0bbb1}#stop:disabled{display:none}</style><button class="mascot" id="chat" aria-label="Talk to Seek" title="Talk to Seek"><span class="buddy" data-buddy="hero" aria-hidden="true"></span></button><div class="label" id="label" role="status" title="Click to chat">Talk to Seek</div><div class="controls"><button id="grip" aria-label="Drag companion">⠿</button><button id="stop" disabled>Stop</button><button id="hide" aria-label="Hide companion" title="Hide · Ctrl/⌘ + Shift + Space to show">×</button></div><script type="module" src="pet.js"></script></html>
