<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'"><title>Seek companion</title><link rel="stylesheet" href="buddy.css"><link rel="stylesheet" href="companion.css"></head>
<body>
<header><span class="buddy" data-buddy="hero" aria-hidden="true"></span><div class="identity"><strong id="name">Seek</strong><span id="connection">Connect your sidekick</span></div><button class="icon" id="settings" aria-label="Connection and desktop settings" title="Settings">⚙</button><button class="icon" id="close" aria-label="Close chat" title="Close">×</button></header>
<nav><button id="new">＋ New conversation</button><select id="recent" aria-label="Recent conversations"><option value="">Recent conversations</option></select></nav>
<main id="scroll"><section id="welcome"><span class="eyebrow">YOUR SIDEKICK, AT YOUR SIDE</span><h1>What can I help with?</h1><p>Ask a question. Find something. Get a task off your plate.</p><div class="examples"><button data-mode="chat" data-text="Help me think through ">Think it through <span>↗</span></button><button data-mode="browser" data-text="In Seek’s browser, ">Explore the web <span>↗</span></button><button data-mode="desktop" data-text="On this computer, ">Work in my apps <span>↗</span></button></div></section><section id="conversation" hidden><div class="task-heading"><span class="eyebrow" id="where"></span><h2 id="task-title"></h2><span id="progress" role="status"></span></div><div id="messages" aria-live="polite"></div><div id="question" hidden></div><div id="actions"><button id="continue" hidden>Continue</button><button id="pause" hidden>Pause task</button><button id="browser" hidden>Open Seek browser ↗</button><button id="open">Open in Seek ↗</button></div></section></main>
<div id="error" role="alert" hidden></div>
<footer><div class="modes" role="group" aria-label="Where Seek works"><button data-mode="chat" aria-pressed="true">Chat</button><button data-mode="browser" aria-pressed="false">Browser</button><button data-mode="desktop" aria-pressed="false">This computer</button></div><select id="computer" aria-label="Computer to use" hidden><option value="">This computer</option></select><p id="scope">A conversation with your sidekick.</p><form id="composer"><textarea id="input" rows="2" maxlength="8000" aria-label="Message or task for Seek" placeholder="Ask Seek anything…"></textarea><div class="send-row"><span id="hint">Enter to send · Shift + Enter for a new line</span><button id="send" type="submit">Send <span aria-hidden="true">↑</span></button></div></form><button id="connect" hidden>Connect this computer to Seek →</button><div class="safety"><span id="safety">Your chat travels over an encrypted connection.</span><button id="stop" type="button" hidden>Stop & take control</button></div></footer>
<script type="module" src="companion-ui.js"></script></body></html>
