<!doctype html><html lang="en"><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'"><title>Seek Desktop</title><link rel="stylesheet" href="buddy.css"><style>body{font:15px system-ui;background:#f8f5fc;color:#342745;padding:24px 24px 90px;margin:0}button,input,select{font:inherit;padding:12px;border-radius:12px;border:1px solid #d1c4e2;margin:5px 0;width:100%;box-sizing:border-box}button{background:#7656a5;color:white;cursor:pointer}button:disabled{opacity:.5;cursor:default}.buddy{--bs:100px!important;margin:12px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}#stop{background:#9e364f;position:fixed;bottom:12px;left:24px;width:calc(100% - 48px);z-index:10;box-shadow:0 -6px 20px #f8f5fc}label{display:block;margin-top:12px}#capability{font-size:13px;color:#705771}</style><h1>Seek Desktop</h1><span class="buddy" data-buddy="hero"></span><p id="activity" role="status">Ready</p><p id="capability"></p><p>Desktop control shares your mouse and keyboard. Take over at any time with <strong>Ctrl/Command + Alt + Shift + S</strong>.</p><label>Screen<select id="display"></select></label><label>Task ID<input id="task" placeholder="Task ID to authorize"></label><button id="grant">Give this task control</button><button id="stop">Take control / Stop</button><button id="show-pet">Show companion</button><details><summary>Connection details</summary><pre id="details"></pre></details><script type="module" src="panel.js"></script></html>
