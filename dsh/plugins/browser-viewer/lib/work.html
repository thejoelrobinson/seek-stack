<section id="composer-area" class="composer-area"><div id="attachments" class="attachment-row"></div><form id="composer"><textarea id="prompt" aria-label="Give your agent a task" placeholder="Tell me what you want to get done…" rows="2" required></textarea><div class="composer-bottom"><div class="composer-options"><div class="menu-wrap"><button type="button" class="icon-btn composer-plus" id="composer-plus" aria-haspopup="menu" aria-expanded="false" aria-controls="composer-menu" aria-label="Attach, create an image, schedule or use a workflow" title="Attach, image, schedule, workflow"><svg class="ic" aria-hidden="true" focusable="false"><use href="#i-plus"/></svg></button><div class="menu up" id="composer-menu" role="menu" hidden><button type="button" role="menuitem" id="attach"><svg class="ic" aria-hidden="true" focusable="false"><use href="#i-clip"/></svg><span>Attach files<small>Up to 5 files, 8 MB each</small></span></button><button type="button" role="menuitem" id="image-mode"><svg class="ic" aria-hidden="true" focusable="false"><use href="#i-image"/></svg><span>Create an image<small>Qwen Image 2.1, made on this PC</small></span></button><button type="button" role="menuitem" id="schedule"><svg class="ic" aria-hidden="true" focusable="false"><use href="#i-clock"/></svg><span>Schedule it<small>Later, every day or every week</small></span></button><button type="button" role="menuitem" id="workflow-open" data-view="workflows"><svg class="ic" aria-hidden="true" focusable="false"><use href="#i-template"/></svg><span>Use a workflow<small>Proven starting points you can reuse</small></span></button></div></div><input id="file-input" type="file" multiple hidden><label class="mode-pill" title="Do the task: work through the steps. Just chat: answer in conversation."><select id="mode" aria-label="Where Seek works"><option value="task">Do the task</option><option value="chat">Just chat</option><option value="browser">Seek browser</option></select><svg class="ic ic-sm" aria-hidden="true" focusable="false"><use href="#i-chevron-down"/></svg></label><span class="composer-chips" id="composer-chips"><span class="chip-pill" id="image-chip" hidden><svg class="ic ic-sm" aria-hidden="true" focusable="false"><use href="#i-image"/></svg>Image<button type="button" id="image-clear" aria-label="Leave image mode"><svg class="ic ic-sm" aria-hidden="true" focusable="false"><use href="#i-x"/></svg></button></span><span class="chip-pill" id="schedule-chip" hidden><svg class="ic ic-sm" aria-hidden="true" focusable="false"><use href="#i-clock"/></svg><span id="schedule-summary"></span><button type="button" id="schedule-clear" aria-label="Remove the schedule"><svg class="ic ic-sm" aria-hidden="true" focusable="false"><use href="#i-x"/></svg></button></span></span></div><div class="composer-send"><button type="button" class="icon-btn" id="voice-input" aria-label="Dictate a request" title="Dictate" hidden><svg class="ic" aria-hidden="true" focusable="false"><use href="#i-mic"/></svg><span class="sr-only" data-voice-label>Voice</span></button><button id="send" class="send" type="submit" aria-label="Send"><svg class="ic" aria-hidden="true" focusable="false"><use href="#i-send"/></svg></button></div></div></form><p class="voice-status" id="voice-status" role="status"></p><p class="composer-hint" id="composer-hint"></p></section>
</div>
<aside class="agent-panel" id="agent-panel" aria-label="Inbox"><div class="ap-head"><div class="buddy-stage panel" data-stage="panel"><span class="buddy" data-buddy="panel" data-track></span><span class="buddy-say" role="status"></span></div><div class="ap-title"><strong>Inbox</strong><span id="ap-status">Ready to help</span></div><button class="icon-btn ap-pin" id="ap-pin" aria-pressed="false" aria-label="Keep the inbox open beside your work" title="Keep the inbox open beside your work"><svg class="ic" aria-hidden="true" focusable="false"><use href="#i-pin"/></svg></button><button class="icon-btn ap-close" id="ap-close" aria-label="Close the inbox"><svg class="ic" aria-hidden="true" focusable="false"><use href="#i-x"/></svg></button></div><div class="ap-tabs" role="tablist" aria-label="Inbox"><button data-ap="approvals" class="active"><span>For you</span><b id="ap-count"></b></button><button data-ap="upcoming"><span>Upcoming</span></button><button data-ap="activity"><span>Activity</span></button></div><div class="ap-body" id="ap-body"></div></aside>
<div class="panel-scrim" id="panel-scrim" data-scrim></div><nav class="bottom-bar" aria-label="Sections"><button data-view="chat"><svg class="ic" aria-hidden="true" focusable="false"><use href="#i-chat"/></svg><span>Chat</span></button><button data-view="tasks"><svg class="ic" aria-hidden="true" focusable="false"><use href="#i-tasks"/></svg><span>Tasks</span></button><button data-view="inbox" aria-controls="agent-panel"><svg class="ic ic-bell" aria-hidden="true" focusable="false"><use href="#i-bell"/></svg><span>Inbox</span><b id="bb-count"></b></button><button data-view="calendar"><svg class="ic" aria-hidden="true" focusable="false"><use href="#i-calendar"/></svg><span>Calendar</span></button><button id="mobile-more" aria-controls="workspace-nav" aria-expanded="false" aria-label="More: Studio, Finance, Settings and your chats"><svg class="ic" aria-hidden="true" focusable="false"><use href="#i-menu"/></svg><span>More</span></button></nav>
<div id="toast" role="status" aria-live="polite" hidden></div>
<dialog id="schedule-dialog"><form method="dialog"><h2>When should I work on this?</h2><p>Seek must be running. Repeating work stays anchored to this local time, including daylight saving changes.</p><label>Start date and local time<input type="datetime-local" id="run-at" required></label><label>Repeat<select id="repeat"><option value="">One time</option><option value="24">Every day</option><option value="168">Every week on the selected weekday</option></select></label><label>Time zone<input id="schedule-zone" placeholder="America/Chicago" required></label><label>If Seek is offline<select id="schedule-missed"><option value="latest">Run the latest missed occurrence when back</option><option value="skip">Skip missed occurrences</option></select></label><div class="dialog-actions"><button value="cancel" formnovalidate>Cancel</button><button class="primary" value="save">Save schedule</button></div></form></dialog>
<dialog id="artifact-dialog"><div class="preview-head"><strong id="preview-title">File preview</strong><button id="close-preview" class="icon-btn" aria-label="Close preview"><svg class="ic" aria-hidden="true" focusable="false"><use href="#i-x"/></svg></button></div><iframe id="preview-frame" title="Artifact preview" sandbox="allow-scripts"></iframe></dialog>
<dialog id="product-dialog" aria-label="Workspace action"></dialog>
<dialog id="search-dialog" class="palette" aria-label="Search and go anywhere"><div class="palette-input"><svg class="ic" aria-hidden="true" focusable="false"><use href="#i-search"/></svg><input id="workspace-query" type="search" placeholder="Search chats, files and memory, or jump anywhere…" autocomplete="off" spellcheck="false" role="combobox" aria-expanded="true" aria-controls="workspace-search-results" aria-autocomplete="list"><button type="button" class="palette-esc" data-dialog-close aria-label="Close search">Esc</button></div><div id="workspace-search-results" class="palette-results" role="listbox" aria-label="Results"></div><div class="palette-foot" aria-hidden="true"><span><kbd>↑</kbd><kbd>↓</kbd> move</span><span><kbd>Enter</kbd> open</span><span><kbd>Esc</kbd> close</span></div></dialog>
<script type="module" src="/work/buddy.js"></script><script type="module" src="/work/browser.js"></script><script type="module" src="/work/app.js"></script>
</body></html>
